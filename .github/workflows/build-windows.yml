name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build Windows AMD64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o dist/TDeltaFuuuk.exe ./cmd/hub
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o dist/TDeltaAgent.exe ./cmd/agent
          sha256sum dist/*.exe > dist/SHA256SUMS.txt
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TDeltaFuuuk-windows-amd64
          path: dist/
          if-no-files-found: error
