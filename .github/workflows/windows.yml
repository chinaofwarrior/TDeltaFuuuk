name: Windows portable verified build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Unit and integration tests; Windows native and portable builds
        run: .\scripts\build.ps1
      - name: Required artifact verification
        run: |
          @('dist/TDeltaFuuuk.exe','dist/TDeltaAgent.exe','dist/runtime/node.exe','dist/native/tdf-provider-host.exe','dist/native/example-provider.dll') | ForEach-Object {
            if(!(Test-Path $_)){throw "missing: $_"}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TDeltaFuuuk-portable-windows-amd64
          path: dist/
          if-no-files-found: error
