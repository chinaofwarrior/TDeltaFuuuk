name: Windows portable verified build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Unit and integration tests; Windows native and portable builds
        run: .\scripts\build.ps1
      - name: Required artifact verification
        run: |
          @('dist/TDeltaFuuuk.exe','dist/TDeltaAgent.exe','dist/runtime/node.exe','dist/native/tdf-provider-host.exe','dist/native/example-provider.dll') | ForEach-Object {
            if(!(Test-Path $_)){throw "missing: $_"}
          }
      - name: Smoke run native host and bundled Hub EXE
        run: |
          $native=Start-Process -FilePath .\\dist\\native\\tdf-provider-host.exe -ArgumentList @('--dll', (Resolve-Path .\\dist\\native\\example-provider.dll).Path) -PassThru -RedirectStandardOutput native-smoke.log
          Start-Sleep -Seconds 3
          if(!$native.HasExited){Stop-Process -Id $native.Id -Force}
          $output=Get-Content native-smoke.log -Raw
          if(!$output.Contains('"type":"hello"') -or !$output.Contains('"type":"observation"') -or !$output.Contains('LOADOUT_STATE') -or !$output.Contains('SUPPLY_STATE')){throw "Native DLL host smoke failed"}
          $env:TDF_NO_BROWSER='1'
          $env:TDF_NO_AUTO_AGENT='1'
          $exe=Start-Process -FilePath .\\dist\\TDeltaFuuuk.exe -PassThru -RedirectStandardOutput hub-smoke.log
          try{
            $ready=$false
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 300
              try{$response=Invoke-WebRequest -Uri http://127.0.0.1:17888 -UseBasicParsing -TimeoutSec 1;if($response.StatusCode -eq 200){$ready=$true;break}}catch{}
            }
            if(!$ready){throw "portable EXE did not start embedded web UI"}
          }finally{
            taskkill /F /T /PID $exe.Id 2>$null | Out-Null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TDeltaFuuuk-portable-windows-amd64
          path: dist/
          if-no-files-found: error
