<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#081019" />
  <title>TDeltaFuuuk · 实时战术助手</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">REAL-TIME SQUAD TACTICAL COPILOT</div>
      <h1>TDeltaFuuuk</h1>
    </div>
    <div class="connection">
      <span id="statusDot" class="dot idle"></span>
      <span id="statusText">未连接</span>
      <span id="latency">-- ms</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel control-panel">
      <div class="panel-title"><h2>实时数据源</h2><span id="frameRate" class="muted">0 Hz</span></div>
      <label>WebSocket 地址</label>
      <div class="row">
        <input id="wsUrl" value="ws://127.0.0.1:8765" spellcheck="false" />
        <button id="connectBtn">连接</button>
      </div>
      <div class="row compact">
        <button id="demoBtn" class="secondary">启动 Demo</button>
        <button id="voiceBtn" class="secondary">语音：开</button>
        <button id="clearBtn" class="ghost">清空</button>
      </div>
      <div class="metrics four">
        <div><strong id="teamCount">0</strong><span>队友</span></div>
        <div><strong id="contactCount">0</strong><span>目标</span></div>
        <div><strong id="nearest">--</strong><span>最近距离</span></div>
        <div><strong id="riskLevel">安全</strong><span>风险</span></div>
      </div>
    </section>

    <section class="panel radar-panel">
      <div class="panel-title">
        <h2>战术态势</h2>
        <div class="legend">
          <span><i class="legend-dot self"></i>自己</span>
          <span><i class="legend-dot team"></i>队友</span>
          <span><i class="legend-dot enemy"></i>已知目标</span>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="radar"></canvas>
        <div class="north">N</div>
        <div id="primaryAlert" class="primary-alert hidden"></div>
      </div>
      <div class="scale-row">
        <label>显示半径 <strong id="rangeLabel">120m</strong></label>
        <input id="range" type="range" min="40" max="300" value="120" step="10" />
      </div>
    </section>

    <section class="panel threat-panel">
      <div class="panel-title"><h2>威胁 / 已知装备</h2><span class="muted">实时</span></div>
      <div id="threatList" class="list empty">等待数据</div>
    </section>

    <section class="panel team-panel">
      <div class="panel-title"><h2>队伍状态 / 装备</h2><span class="muted">协同</span></div>
      <div id="teamList" class="list empty">等待数据</div>
    </section>

    <section class="panel event-panel">
      <div class="panel-title"><h2>报点与事件流</h2><span id="clock" class="muted"></span></div>
      <div id="eventLog" class="event-log"></div>
    </section>

    <section class="panel supply-panel">
      <div class="panel-title"><h2>队伍补给总览</h2><span class="muted">生命 · 护甲 · 弹药 · 医疗 · 修甲 · 投掷物</span></div>
      <div id="supplyList" class="supply-grid empty">等待队伍装备与补给数据</div>
    </section>
  </main>

  <footer>
    通用实时 telemetry 客户端 · 装备与补给字段只显示数据源明确提供的信息；不包含游戏进程注入、内存读取、DMA、反作弊绕过或隐藏信息提取。
  </footer>
  <script src="./app.js"></script>
</body>
</html>
